name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit, integration (Azurite) and UI tests
        run: npm test
      - name: Package the API, the checker and the dashboard
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          include-hidden-files: true
          path: |
            .deploy/
            web/dist/

  deploy-dashboard:
    name: Deploy dashboard + API (Static Web Apps)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - id: ready
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::notice::Skipping: add the AZURE_STATIC_WEB_APPS_API_TOKEN secret to deploy (see docs/azure-setup.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: build
      - if: steps.ready.outputs.skip != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          api_location: .deploy/api
          skip_app_build: true
          skip_api_build: true

  deploy-checker:
    name: Deploy checker (Azure Functions)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
      APP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
    steps:
      - id: ready
        run: |
          if [ -z "$PUBLISH_PROFILE" ] || [ -z "$APP_NAME" ]; then
            echo "::notice::Skipping: add the AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret and AZURE_FUNCTIONAPP_NAME variable to deploy (see docs/azure-setup.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: build
      - if: steps.ready.outputs.skip != 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .deploy/checker
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
          remote-build: false
