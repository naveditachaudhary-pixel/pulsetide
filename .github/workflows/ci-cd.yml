name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit, integration (Azurite) and UI tests
        run: npm test
      - name: Package the API, the checker, the scheduled runner and the dashboard
        run: npm run build && npm run build:runner
      - uses: actions/upload-artifact@v4
        with:
          name: build
          include-hidden-files: true
          path: |
            .deploy/
            web/dist/

  # Optional: publish the dashboard from this repo's own GitHub Pages site. Turned off by default because
  # the dashboard is published inside the portfolio site (see README); set the repo variable
  # DEPLOY_PAGES to "true" and enable Pages (Source: GitHub Actions) to use this instead.
  pages:
    name: Deploy dashboard (GitHub Pages)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the dashboard to read status.json from the status-data branch
        run: npm run build -w web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_HOSTING: github
          VITE_STATUS_URL: https://raw.githubusercontent.com/${{ github.repository }}/status-data/status.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # The two jobs below deploy to Azure instead. They skip themselves until the Azure secrets exist.
  deploy-dashboard:
    name: Deploy dashboard + API (Static Web Apps)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - id: ready
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::notice::Skipping: add the AZURE_STATIC_WEB_APPS_API_TOKEN secret to deploy (see docs/azure-setup.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: build
      - if: steps.ready.outputs.skip != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          api_location: .deploy/api
          skip_app_build: true
          skip_api_build: true

  deploy-checker:
    name: Deploy checker (Azure Functions)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
      APP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
    steps:
      - id: ready
        run: |
          if [ -z "$PUBLISH_PROFILE" ] || [ -z "$APP_NAME" ]; then
            echo "::notice::Skipping: add the AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret and AZURE_FUNCTIONAPP_NAME variable to deploy (see docs/azure-setup.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: build
      - if: steps.ready.outputs.skip != 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .deploy/checker
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
          remote-build: false
